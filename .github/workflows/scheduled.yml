name: Scheduled Workflow

# Pilot caller on the fork: manual runs only, the schedule is added when rolled out upstream.
on:
  workflow_dispatch: {}

concurrency:
  group: sca-scheduled
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@pilot/sca-scheduled
    with:
      repository: epam/ai-dial-quickapps-backend
      images: |
        epam/ai-dial-quickapps-backend
        epam/ai-dial-sca-pilot-missing-image
